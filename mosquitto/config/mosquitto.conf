# Конфигурация Mosquitto MQTT брокера для SWARM CLEANER

# Локальный слушатель
listener 1883
protocol mqtt

# Веб-сокет слушатель (для веб-клиентов)
listener 9001
protocol websockets

# Позволить анонимные подключения (для MVP, в production отключить)
allow_anonymous true

# Файл с пользователями (опционально, для production)
# password_file /mosquitto/config/passwd

# Логирование
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Хранилище сообщений
persistence true
persistence_location /mosquitto/data/

# Максимальный размер сообщения (10MB)
message_size_limit 10485760

# Сохранять сообщения при отключении клиента
retained_persistence true

# Время жизни сообщений (секунды)
max_message_expiry_interval 3600

