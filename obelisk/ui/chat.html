<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭкоНет - Интерактивный диалог</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .status.connected {
            background: rgba(76, 175, 80, 0.3);
        }
        
        .status.disconnected {
            background: rgba(244, 67, 54, 0.3);
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            text-align: right;
        }
        
        .message.assistant {
            text-align: left;
        }
        
        .message-bubble {
            display: inline-block;
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
        }
        
        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message.assistant .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            padding: 0 5px;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
        }
        
        .input-container input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .input-container input:focus {
            border-color: #667eea;
        }
        
        .input-container button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .input-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .input-container button:active {
            transform: translateY(0);
        }
        
        .input-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .quick-action {
            padding: 8px 15px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        
        .quick-action:hover {
            background: #e0e0e0;
        }
        
        .typing-indicator {
            display: none;
            padding: 10px;
            color: #999;
            font-style: italic;
        }
        
        .typing-indicator.active {
            display: block;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 ЭкоНет</h1>
            <p>Система автономной уборки окурков</p>
            <div class="status disconnected" id="status">Отключено</div>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message assistant">
                <div class="message-bubble">
                    Привет! Я ЭкоНет, система автономной уборки окурков. Готов помочь! 👋
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            ЭкоНет печатает...
        </div>
        
        <div class="input-area">
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Напишите сообщение..." 
                       onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="sendButton" onclick="sendMessage()">Отправить</button>
            </div>
            <div class="quick-actions">
                <button class="quick-action" onclick="sendQuickMessage('Что видишь?')">Что видишь?</button>
                <button class="quick-action" onclick="sendQuickMessage('Сколько окурков?')">Сколько окурков?</button>
                <button class="quick-action" onclick="sendQuickMessage('Статус')">Статус</button>
                <button class="quick-action" onclick="sendQuickMessage('Помощь')">Помощь</button>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const status = document.getElementById('status');
        const typingIndicator = document.getElementById('typingIndicator');
        
        // Определение WebSocket URL
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsHost = window.location.host;
        const wsUrl = `${wsProtocol}//${wsHost}/api/v1/chat/ws`;
        
        function connect() {
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    status.textContent = 'Подключено';
                    status.className = 'status connected';
                    sendButton.disabled = false;
                    addSystemMessage('Соединение установлено! ✅');
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.error) {
                        addMessage('assistant', `Ошибка: ${data.error}`, true);
                    } else {
                        addMessage('assistant', data.response);
                    }
                    
                    typingIndicator.classList.remove('active');
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    addSystemMessage('Ошибка соединения. Попробуйте перезагрузить страницу.');
                };
                
                ws.onclose = () => {
                    status.textContent = 'Отключено';
                    status.className = 'status disconnected';
                    sendButton.disabled = true;
                    addSystemMessage('Соединение закрыто. Переподключение...');
                    setTimeout(connect, 3000);
                };
            } catch (error) {
                console.error('Connection error:', error);
                addSystemMessage('Не удалось подключиться. Убедитесь, что сервер запущен.');
            }
        }
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }
            
            addMessage('user', message);
            messageInput.value = '';
            
            typingIndicator.classList.add('active');
            
            ws.send(JSON.stringify({
                message: message,
                visual_context: null
            }));
        }
        
        function sendQuickMessage(message) {
            messageInput.value = message;
            sendMessage();
        }
        
        function addMessage(role, text, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            if (isError) {
                messageDiv.innerHTML = `<div class="error">${text}</div>`;
            } else {
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = text;
                messageDiv.appendChild(bubble);
                
                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = new Date().toLocaleTimeString();
                messageDiv.appendChild(time);
            }
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function addSystemMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.style.opacity = '0.7';
            messageDiv.innerHTML = `<div class="message-bubble" style="background: #e3f2fd; color: #1976d2;">${text}</div>`;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // Инициализация при загрузке
        connect();
        
        // Фокус на input
        messageInput.focus();
    </script>
</body>
</html>
